<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление магазином — One Second</title><link rel="stylesheet" href="/admin.css"></head><body><aside><a class="logo" href="/">◷ One <b>Second</b></a><small>УПРАВЛЕНИЕ МАГАЗИНОМ</small><nav><button data-page="overview" class="active">◫ Обзор</button><button data-page="products">◷ Товары</button><button data-page="brands">◇ Бренды</button><button data-page="settings">⚙ Контакты</button></nav><a class="shop-link" href="/" target="_blank">Открыть магазин ↗</a></aside><main><header><div><span class="eyebrow">ONE SECOND / ADMIN</span><h1 id="pageTitle">Обзор</h1></div><div class="header-right"><span id="userName"></span><span class="admin-badge">Администратор</span><a class="logout-link" href="/admin/security">Пароль</a><form method="post" action="/api/admin/logout"><button class="logout-link" type="submit">Выйти</button></form></div></header><div id="notice" role="status">Загрузка каталога…</div><div class="savebar"><div><b id="saveState">Все изменения сохранены</b><small id="updatedAt"></small></div><div><button id="refresh">Обновить данные</button><button id="saveAll" class="primary" disabled>Сохранить изменения</button></div></div><section id="content"></section></main><dialog id="editDialog"><form id="productForm"><div class="dialog-head"><div><span class="eyebrow">КАРТОЧКА ТОВАРА</span><h2 id="editTitle">Редактировать часы</h2></div><button type="button" id="closeEdit" aria-label="Закрыть">×</button></div><div class="form-grid"><label>Название модели<input name="name" required maxlength="180"></label><label>Бренд<select name="brand" required></select></label><label>Коллекция<select name="type"><option>Классика</option><option>Спорт</option><option>Повседневные</option></select></label><label>Пол<select name="gender"><option value="">Не указан</option><option value="men">Мужские</option><option value="women">Женские</option><option value="unisex">Универсальные</option></select></label><label>Механизм<input name="mechanism" maxlength="200" placeholder="Например, кварцевый"></label><label>Размер корпуса<input name="size" maxlength="100" placeholder="Например, 40 мм"></label><label>Материалы<input name="material" maxlength="300"></label><label class="wide">Источник характеристик<input name="source" type="url" placeholder="https://…"></label><label class="check"><input name="active" type="checkbox"> Показывать товар в магазине</label></div><div class="variants-head"><div><h3>Цвета и артикулы</h3><p>У каждого варианта свои фото, цена и наличие.</p></div><button id="addVariant" type="button">+ Добавить цвет</button></div><div id="variantForms"></div><p id="formError" class="error" role="alert"></p><div class="dialog-footer"><span>После применения нажмите «Сохранить изменения».</span><button type="submit" class="primary">Применить карточку</button></div></form></dialog><div id="toast" role="status"></div><script src="/admin.js"></script></body></html>
